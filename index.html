<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dulce 3D - Pastelería Premium</title>
    
    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0B0B0B;
            color: #F8F4F0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ELEGANTE ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0B0B; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(11, 11, 11, 0.6);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            transition: 0.3s;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 2px;
        }
        .logo span { color: #F8F4F0; font-weight: 300; }
        
        .nav a {
            color: #F8F4F0;
            text-decoration: none;
            margin: 0 25px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            transition: 0.3s;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0%; height: 1px;
            background: #D4AF37;
            transition: 0.3s;
        }
        .nav a:hover { color: #D4AF37; }
        .nav a:hover::after { width: 100%; }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 24px;
            color: #D4AF37;
        }
        .cart-badge {
            position: absolute;
            top: -10px; right: -12px;
            background: #D4AF37;
            color: #0B0B0B;
            font-size: 11px;
            font-weight: 700;
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        /* ===== HERO ===== */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0B0B0B 70%);
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 700;
            color: #D4AF37;
            text-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
            margin-bottom: 20px;
            animation: fadeUp 1.2s ease;
        }
        .hero p {
            font-size: 18px;
            font-weight: 300;
            color: #B0B0B0;
            max-width: 500px;
            margin-bottom: 40px;
            animation: fadeUp 1.4s ease;
        }
        .btn-gold {
            background: #D4AF37;
            color: #0B0B0B;
            border: none;
            padding: 16px 48px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
            text-transform: uppercase;
            animation: fadeUp 1.6s ease;
        }
        .btn-gold:hover {
            background: #F9E79F;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
            transform: scale(1.03);
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== SECCIÓN PRODUCTOS ===== */
        .products-section {
            padding: 80px 50px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            color: #D4AF37;
            text-align: center;
            margin-bottom: 12px;
        }
        .section-sub {
            text-align: center;
            color: #B0B0B0;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .grid-3d {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .product-card {
            background: #F8F4F0;
            border-radius: 24px;
            padding: 30px 20px 25px;
            text-align: center;
            color: #0B0B0B;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .product-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #D4AF37, #F9E79F, #D4AF37);
            border-radius: 26px;
            z-index: -1;
            opacity: 0;
            transition: 0.4s;
        }
        .product-card:hover::before { opacity: 1; }
        .product-card:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 30px 50px rgba(212, 175, 55, 0.15);
        }

        .product-card .canvas-container {
            width: 100%;
            height: 220px;
            margin-bottom: 15px;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a1a;
            cursor: grab;
        }

        .product-card h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .product-card .desc {
            color: #555;
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 12px;
        }
        .product-card .price {
            font-size: 28px;
            font-weight: 700;
            color: #D4AF37;
            margin-bottom: 16px;
        }
        .btn-add {
            background: transparent;
            border: 2px solid #D4AF37;
            color: #0B0B0B;
            padding: 10px 32px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .btn-add:hover {
            background: #D4AF37;
            color: #0B0B0B;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        /* ===== CARRITO LATERAL ===== */
        .cart-overlay {
            position: fixed;
            top: 0; right: -450px;
            width: 420px;
            height: 100vh;
            background: #0B0B0B;
            border-left: 2px solid #D4AF37;
            z-index: 2000;
            padding: 30px 25px;
            transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow-y: auto;
            box-shadow: -20px 0 60px rgba(0,0,0,0.8);
        }
        .cart-overlay.open { right: 0; }

        .cart-overlay h2 {
            font-family: 'Playfair Display', serif;
            color: #D4AF37;
            font-size: 32px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 12px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 400; }
        .cart-item-price { color: #D4AF37; font-weight: 600; }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-item-qty button {
            background: transparent;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .cart-item-qty button:hover { background: #D4AF37; color: #0B0B0B; }
        .cart-item-qty span { min-width: 20px; text-align: center; }

        .cart-total {
            margin-top: 30px;
            font-size: 22px;
            text-align: right;
            color: #F8F4F0;
            border-top: 2px solid #D4AF37;
            padding-top: 20px;
        }
        .cart-total span { color: #D4AF37; font-weight: 700; }

        .btn-checkout {
            width: 100%;
            background: #D4AF37;
            color: #0B0B0B;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-checkout:hover { background: #F9E79F; transform: scale(1.02); }

        .close-cart {
            position: absolute;
            top: 20px; right: 25px;
            font-size: 30px;
            color: #D4AF37;
            cursor: pointer;
            background: none;
            border: none;
            transition: 0.3s;
        }
        .close-cart:hover { transform: rotate(90deg); }

        .cart-empty {
            text-align: center;
            color: #B0B0B0;
            margin-top: 60px;
            font-size: 18px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            color: #B0B0B0;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .footer strong { color: #D4AF37; font-weight: 400; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-wrap: wrap; }
            .nav { display: none; }
            .hero h1 { font-size: 40px; }
            .products-section { padding: 40px 20px; }
            .cart-overlay { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">Dulce<span>3D</span></div>
        <nav class="nav">
            <a href="#">Inicio</a>
            <a href="#">Productos</a>
            <a href="#">Nosotros</a>
            <a href="#">Contacto</a>
        </nav>
        <div class="cart-icon" id="cartToggle">
            🛒
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <!-- ===== HERO ===== -->
    <section class="hero">
        <h1>Placer Horneado en 3D</h1>
        <p>Brownies, tortas y galletas con chispas de chocolate belga. Una experiencia visual y gastronómica única.</p>
        <button class="btn-gold" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
            Explorar Menú
        </button>
    </section>

    <!-- ===== PRODUCTOS 3D ===== -->
    <section class="products-section" id="products">
        <h2 class="section-title">Nuestras Creaciones</h2>
        <p class="section-sub">— Interactúa girando cada modelo 3D —</p>

        <div class="grid-3d" id="productGrid">
            <!-- Los productos se inyectan con JS -->
        </div>
    </section>

    <!-- ===== CARRITO LATERAL ===== -->
    <div class="cart-overlay" id="cartOverlay">
        <button class="close-cart" id="closeCart">✕</button>
        <h2>Tu Pedido</h2>
        <div id="cartItems"></div>
        <div class="cart-total">Total: <span id="cartTotal">$0.00</span></div>
        <button class="btn-checkout" id="checkoutBtn">Proceder al Pago</button>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>Hecho con <strong>chocolate</strong> y <strong>código</strong> · 2026</p>
    </footer>

    <!-- ===== THREE.JS ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ============================================================
        // 1. DATOS DE PRODUCTOS (con colores para cada modelo 3D)
        // ============================================================
        const PRODUCTS = [
            { 
                id: 1, 
                name: 'Brownie Supreme', 
                desc: 'Chocolate belga 70% con nueces', 
                price: 5.00, 
                color: 0x4a2c1b,
                secondary: 0x8B5A2B
            },
            { 
                id: 2, 
                name: 'Torta Elegante', 
                desc: 'Tres capas con ganache dorado', 
                price: 25.00, 
                color: 0x2c1810,
                secondary: 0xD4AF37
            },
            { 
                id: 3, 
                name: 'Galleta Crisp', 
                desc: 'Chispas de chocolate y sal marina', 
                price: 4.00, 
                color: 0xdeb887,
                secondary: 0x8B4513
            }
        ];

        // ============================================================
        // 2. CARRITO (con localStorage)
        // ============================================================
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function addToCart(productId) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                const p = PRODUCTS.find(prod => prod.id === productId);
                cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
            }
            saveCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                removeFromCart(productId);
            } else {
                saveCart();
            }
        }

        function updateCartUI() {
            // Badge
            const totalItems = cart.reduce((acc, i) => acc + i.qty, 0);
            document.getElementById('cartCount').textContent = totalItems;

            // Items
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = `<div class="cart-empty">🛒 Tu carrito está vacío</div>`;
                document.getElementById('cartTotal').textContent = '$0.00';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        </div>
                        <div class="cart-item-qty">
                            <button onclick="changeQty(${item.id}, -1)">−</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
        }

        // ============================================================
        // 3. THREE.JS - CREAR MODELOS 3D
        // ============================================================
        function create3DModel(container, product) {
            const width = container.clientWidth || 300;
            const height = container.clientHeight || 220;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            camera.position.set(3, 1, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Luces
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(2, 5, 3);
            keyLight.castShadow = true;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xD4AF37, 0.6);
            fillLight.position.set(-3, 1, 2);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
            rimLight.position.set(0, 0, -5);
            scene.add(rimLight);

            // --- GEOMETRÍA SEGÚN PRODUCTO ---
            let mesh;
            const color = product.color;
            const secondary = product.secondary;

            if (product.id === 1) { // Brownie: caja con textura de "chocolate"
                const geo = new THREE.BoxGeometry(2, 0.8, 2);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    roughness: 0.7, 
                    metalness: 0.1,
                    emissive: new THREE.Color(0x2a1a0a),
                    emissiveIntensity: 0.15
                });
                mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                // chispas (pequeñas esferas)
                for (let i = 0; i < 30; i++) {
                    const chip = new THREE.Mesh(
                        new THREE.SphereGeometry(0.08 + Math.random()*0.07, 6, 6),
                        new THREE.MeshStandardMaterial({ color: secondary, roughness: 0.3, metalness: 0.4 })
                    );
                    chip.position.set(
                        (Math.random() - 0.5) * 1.8,
                        0.45 + Math.random() * 0.2,
                        (Math.random() - 0.5) * 1.8
                    );
                    mesh.add(chip);
                }
            } 
            else if (product.id === 2) { // Torta: cilindro con capas
                const group = new THREE.Group();
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x2c1810, roughness: 0.6 });
                const creamMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, roughness: 0.3, metalness: 0.2 });
                
                const base = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.6, 32), baseMat);
                base.position.y = 0.3;
                base.castShadow = true;
                group.add(base);

                const cream1 = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 0.15, 32), creamMat);
                cream1.position.y = 0.7;
                group.add(cream1);

                const mid = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 32), baseMat);
                mid.position.y = 1.0;
                mid.castShadow = true;
                group.add(mid);

                const cream2 = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.15, 32), creamMat);
                cream2.position.y = 1.3;
                group.add(cream2);

                const top = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.5, 32), baseMat);
                top.position.y = 1.6;
                top.castShadow = true;
                group.add(top);

                // decoración dorada
                const deco = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), creamMat);
                deco.position.set(0, 1.9, 0.9);
                group.add(deco);
                const deco2 = deco.clone();
                deco2.position.set(0.8, 1.9, -0.5);
                group.add(deco2);
                const deco3 = deco.clone();
                deco3.position.set(-0.8, 1.9, -0.5);
                group.add(deco3);

                mesh = group;
            } 
            else { // Galleta: disco con chispas
                const group = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.8 });
                const cookie = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.3, 32), mat);
                cookie.castShadow = true;
                cookie.receiveShadow = true;
                group.add(cookie);

                // chispas
                for (let i = 0; i < 20; i++) {
                    const chip = new THREE.Mesh(
                        new THREE.SphereGeometry(0.08 + Math.random()*0.06, 6, 6),
                        new THREE.MeshStandardMaterial({ color: 0x4a2c1b, roughness: 0.4, metalness: 0.1 })
                    );
                    const angle = Math.random() * Math.PI * 2;
                    const rad = 0.3 + Math.random() * 0.8;
                    chip.position.set(Math.cos(angle)*rad, 0.2, Math.sin(angle)*rad);
                    group.add(chip);
                }
                mesh = group;
            }

            scene.add(mesh);

            // Suelo reflejante (sutil)
            const floorGeo = new THREE.PlaneGeometry(6, 6);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x0a0a0a, 
                roughness: 0.1, 
                metalness: 0.8,
                transparent: true,
                opacity: 0.5
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);

            // OrbitControls para interacción
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.8;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.target.set(0, 0.6, 0);

            // Animación
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Redimensionar
            const resize = () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                if (w > 0 && h > 0) {
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                }
            };
            window.addEventListener('resize', resize);
            // Si el contenedor cambia de tamaño por responsive
            const observer = new ResizeObserver(resize);
            observer.observe(container);

            // Liberar memoria al recargar (opcional)
            container._cleanup = () => {
                observer.disconnect();
                window.removeEventListener('resize', resize);
                renderer.dispose();
            };
        }

        // ============================================================
        // 4. RENDERIZAR PRODUCTOS EN GRID
        // ============================================================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            PRODUCTS.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="canvas-container" id="canvas-${prod.id}"></div>
                    <h3>${prod.name}</h3>
                    <p class="desc">${prod.desc}</p>
                    <div class="price">$${prod.price.toFixed(2)}</div>
                    <button class="btn-add" onclick="addToCart(${prod.id})">Añadir al Carrito</button>
                `;
                grid.appendChild(card);

                // Inicializar 3D después de insertar en DOM
                const container = card.querySelector('.canvas-container');
                // Darle altura fija
                container.style.height = '220px';
                create3DModel(container, prod);
            });
        }

        // ============================================================
        // 5. EVENTOS Y ARRANQUE
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();

            // Toggle carrito
            document.getElementById('cartToggle').addEventListener('click', () => {
                document.getElementById('cartOverlay').classList.toggle('open');
            });
            document.getElementById('closeCart').addEventListener('click', () => {
                document.getElementById('cartOverlay').classList.remove('open');
            });
            // Cerrar con clic fuera (opcional, mejor solo con botón)

            // Checkout
            document.getElementById('checkoutBtn').addEventListener('click', () => {
                if (cart.length === 0) {
                    alert('🛒 Tu carrito está vacío. Agrega algunos dulces.');
                    return;
                }
                alert('🍫 ¡Gracias por tu pedido! (Demo) Total: $' + 
                    cart.reduce((acc, i) => acc + i.price * i.qty, 0).toFixed(2));
                // Aquí conectarías con Stripe/MercadoPago
            });
        });

        // Limpieza suave de los modelos 3D al salir (opcional)
        window.addEventListener('beforeunload', () => {
            document.querySelectorAll('.canvas-container').forEach(el => {
                if (el._cleanup) el._cleanup();
            });
        });
    </script>

</body>
</html>
